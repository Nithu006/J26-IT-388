{
  "name": "Mental health component checks",
  "on": {
    "push": {
      "branches": [
        "IT23330078"
      ],
      "paths": [
        "MentalHealthRiskPrediction/**",
        ".github/workflows/mental-health-component.yml"
      ]
    },
    "pull_request": {
      "paths": [
        "MentalHealthRiskPrediction/**",
        ".github/workflows/mental-health-component.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "python": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "defaults": {
        "run": {
          "working-directory": "MentalHealthRiskPrediction"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install pinned backend environment",
          "run": "python -m pip install -r backend/requirements.txt"
        },
        {
          "name": "Audit tests",
          "run": "python -B -m unittest discover -s tests -v"
        },
        {
          "name": "Backend tests",
          "run": "python -B -m unittest discover -s backend/tests -v"
        },
        {
          "name": "Inference contract tests without model artifacts",
          "run": "python -B -m unittest discover -s ml/tests -p test_inference_contract.py -v"
        },
        {
          "name": "Static scaffold checks",
          "run": "python -B scripts/validate_scaffold.py"
        }
      ]
    },
    "frontend": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "defaults": {
        "run": {
          "working-directory": "MentalHealthRiskPrediction/frontend"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22.14.0",
            "cache": "npm",
            "cache-dependency-path": "MentalHealthRiskPrediction/frontend/package-lock.json"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm test"
        },
        {
          "run": "npm run build"
        }
      ]
    }
  }
}
